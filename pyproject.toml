[project]
name = "harness-agent"
version = "0.1.3"
description = "驾驭工程实践 — 基于 Claude Agent SDK 的智能开发编排系统"
requires-python = ">=3.10"

dependencies = [
    "claude-agent-sdk==0.2.93",
    "click>=8.1.0",
    "anyio>=4.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
harness = "harness_agent.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
